<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>1 Day AI ตัดคลิป v3</title>
<style>
  @font-face { font-family:"LINE Seed Sans TH"; src:url(assets/LINESeedSansTH_Rg.ttf); font-weight:400; }
  @font-face { font-family:"LINE Seed Sans TH"; src:url(assets/LINESeedSansTH_Bd.ttf); font-weight:700; }
  @font-face { font-family:"LINE Seed Sans TH"; src:url(assets/LINESeedSansTH_He.ttf); font-weight:900; }

  :root{ --navy:#0F172A; --blue:#2563FF; --orange:#FF7A3D; --text:#F1F5FF; --soft:#C7D2FE; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#000; }
  body{ font-family:"LINE Seed Sans TH",sans-serif; }
  .poster{ position:relative; width:1080px; height:1350px; overflow:hidden; color:var(--text); background:#101a4a; }
  .abs{ position:absolute; }

  /* ---------- Background: ผ้าม่านจีบแนวตั้ง ---------- */
  .bg{ position:absolute; inset:0; background:
      repeating-linear-gradient(90deg, rgba(8,14,48,.55) 0, rgba(70,110,255,.20) 40px, rgba(140,170,255,.30) 62px, rgba(8,14,48,.55) 108px),
      linear-gradient(180deg, #2C47D8 0%, #2338B8 35%, #16236E 75%, #0F172A 100%); }
  .bg::before{ content:""; position:absolute; inset:0;
      background:radial-gradient(ellipse 55% 40% at 50% 8%, rgba(160,190,255,.45), transparent 70%),
                 radial-gradient(ellipse 40% 30% at 0% 35%, rgba(120,150,255,.35), transparent 70%); }
  .bg::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:520px;
      background:linear-gradient(180deg, transparent, rgba(10,16,40,.85)); }

  /* glass */
  .glass{ background:linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.10));
      border:2px solid rgba(255,255,255,.55); box-shadow:0 14px 30px rgba(5,10,40,.35), inset 0 1px 0 rgba(255,255,255,.6); }

  /* ---------- Top tab ---------- */
  .tab{ left:350px; top:-30px; width:380px; height:112px; border-radius:0 0 30px 30px; display:flex; align-items:flex-end; justify-content:center; gap:14px; padding-bottom:16px; }
  .tab img{ height:52px; }
  .tab span{ font-weight:900; font-size:36px; color:#fff; }
  .tab span b{ color:#fff; font-weight:900; }

  .eyebrow{ left:50%; top:118px; transform:translateX(-50%); padding:14px 44px 8px; font-weight:700; font-size:34px; color:var(--navy);
      background:linear-gradient(90deg, rgba(255,255,255,.35), #fff 25%, #fff 75%, rgba(255,255,255,.35)); white-space:nowrap; }

  /* ---------- Headline ---------- */
  .h-big{ font-weight:900; font-size:116px; line-height:1.35; color:#fff; white-space:nowrap; text-shadow:0 10px 30px rgba(10,20,80,.45); }
  .h-ai{ left:95px; top:186px; }
  .h-sell{ left:520px; top:338px; color:#FFB088;
      background:linear-gradient(180deg,#FFD3BC 0%, #FF8A4C 70%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-shadow:none;
      filter:drop-shadow(0 10px 24px rgba(255,122,61,.35)); }
  .pill{ border-radius:26px; font-weight:700; color:#fff; white-space:nowrap; text-align:center; }
  .p-1day{ left:770px; top:230px; font-size:64px; padding:12px 34px 4px; }
  .p-edit{ left:90px; top:380px; font-size:56px; padding:14px 34px 6px; }

  /* ---------- Card ผู้สอน ---------- */
  .card{ left:80px; top:640px; width:920px; height:400px; border-radius:30px;
      background:linear-gradient(180deg, rgba(180,200,255,.42), rgba(70,100,230,.30) 60%, rgba(30,50,160,.45));
      border:3px solid rgba(255,255,255,.6); box-shadow:0 30px 60px rgba(5,10,40,.45); }
  .people{ left:480px; top:549px; width:540px; height:491px; object-fit:cover; object-position:top; }
  .p-price-lab{ left:118px; top:735px; font-size:28px; padding:10px 26px 4px; border-radius:30px; font-weight:400; }
  .price{ left:112px; top:790px; font-weight:900; font-size:124px; line-height:1.2; color:#fff; text-shadow:0 10px 26px rgba(10,20,80,.45); }
  .price small{ font-size:46px; font-weight:700; }
  .p-full{ left:118px; top:965px; font-size:28px; padding:10px 26px 4px; border-radius:30px; background:rgba(15,23,42,.55); border:2px solid rgba(255,255,255,.5); }
  .p-full s{ opacity:.9; }
  .seat{ left:840px; top:875px; width:160px; height:160px; border-radius:50%; background:var(--orange); border:6px solid #fff;
      display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(8deg); box-shadow:0 20px 34px rgba(5,10,40,.45); }
  .seat small{ font-size:22px; font-weight:700; }
  .seat b{ font-size:66px; font-weight:900; line-height:.95; }

  /* icons ลอย */
  .app{ border-radius:30px; overflow:hidden; background:#fff; }
  .app img{ width:118%; height:118%; margin:-9%; display:block; }
  .icon-sharp{ left:900px; top:520px; width:126px; height:126px; transform:rotate(12deg); box-shadow:0 24px 40px rgba(5,10,40,.5); }
  .blur-l{ left:-70px; top:520px; width:230px; height:230px; border-radius:52px; transform:rotate(-8deg); filter:blur(10px); opacity:.95; }
  .blur-r{ left:880px; top:1210px; width:240px; height:240px; border-radius:56px; transform:rotate(-14deg); filter:blur(12px); opacity:.9; }

  /* ---------- Info row ---------- */
  .info{ border-radius:40px; display:flex; align-items:center; gap:12px; font-size:26px; color:#fff; padding:14px 22px 10px; white-space:nowrap; }
  .info svg{ flex:none; margin-top:-4px; }
  .i1{ left:58px; top:1094px; } .i2{ left:380px; top:1094px; } .i3{ left:720px; top:1094px; }

  /* ---------- CTA ---------- */
  .cta{ left:50%; top:1205px; transform:translateX(-50%); border-radius:40px; display:flex; align-items:center; gap:14px; padding:10px 12px 10px 10px; }
  .cta .k{ background:#24307A; color:#fff; border-radius:30px; font-size:28px; padding:12px 26px 8px; }
  .cta .v{ font-weight:900; font-size:36px; color:#fff; padding:6px 22px 0 6px; }
</style>
</head>
<body>
<div class="poster" id="poster">
  <div class="bg" id="bg"></div>

  <div class="abs app blur-l" id="blurL"><img src="assets/claude.png" alt=""></div>

  <div class="abs tab glass" id="tab"><img src="assets/logo-cat.png" alt=""><span><b>To</b>Greater</span></div>
  <div class="abs eyebrow" id="eyebrow">คอร์สสด 1 วันจบ</div>

  <div class="abs h-big h-ai" id="hai">AI ตัดคลิป</div>
  <div class="abs pill glass p-1day" id="p1day">1 Day</div>
  <div class="abs pill glass p-edit" id="pedit">ทำคลิป ตัดต่อ</div>
  <div class="abs h-big h-sell" id="hsell">พร้อมขาย</div>

  <div class="abs card" id="card"></div>
  <img class="abs people" id="people" src="assets/instructors.png" alt="ผู้สอน">
  <div class="abs app icon-sharp" id="iconSharp"><img src="assets/capcut.png" alt="CapCut"></div>

  <div class="abs pill glass p-price-lab" id="plab">ราคารอบแรก</div>
  <div class="abs price" id="price">6,990</div>
  <div class="abs pill p-full" id="pfull">บาท/ท่าน · <s>ราคาเต็ม 8,500</s></div>
  <div class="abs seat" id="seat"><small>รับเพียง</small><b>10</b><small>ที่นั่ง</small></div>

  <div class="abs info glass i1" id="i1">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>เสาร์ 7 พ.ย. 2026</span></div>
  <div class="abs info glass i2" id="i2">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>
    <span>CapCut × Claude</span></div>
  <div class="abs info glass i3" id="i3">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/></svg>
    <span>LINE @togreater</span></div>

  <div class="abs cta glass" id="cta"><span class="k">สนใจ</span><span class="v">คอมเมนต์เลย</span></div>

  <div class="abs app blur-r" id="blurR"><img src="assets/claude.png" alt=""></div>
</div>
</body>
</html>
