</div><script>
const c=document.getElementById('dots').getContext('2d');c.scale(2,2);
let s=3;const R=()=>(s=(s*16807)%2147483647)/2147483647;
const cx=560,cy=300;
function dot(x,y,r,al,col){c.globalAlpha=al;c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
for(let k=0;k<180;k++){const a=k/180*Math.PI*2+R()*.03,len=420+R()*560;
 for(let r=60+R()*40;r<len;r+=5+R()*9+r*.025){const j=(R()-.5)*(4+r*.03);
  const x=cx+Math.cos(a)*r*1.45-Math.sin(a)*j,y=cy+Math.sin(a)*r+Math.cos(a)*j,f=1-r/len;
  dot(x,y,.7+R()*1.6*(.5+f),.2+.75*f,R()<.7?'#e4ee4c':'#fafcc6');}}
for(let i=0;i<2500;i++){const x=R()*1280,y=R()*720;dot(x,y,.6+R()*1.1,.15+R()*.35,'#d9e84a');}
</script></body></html>
