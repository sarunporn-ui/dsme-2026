<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mali;src:url(../fonts/Mali-Bold.ttf);font-weight:700}
@font-face{font-family:Mali;src:url(../fonts/Mali-SemiBold.ttf);font-weight:600}

html,body{margin:0;width:1280px;height:720px;overflow:hidden}
#s{position:absolute;inset:0;background:radial-gradient(ellipse at 72% 50%,#d7e6f5 0%,#a9c3df 55%,#86a6c9 100%);overflow:hidden;font-family:sky}
svg.bg{position:absolute;inset:0}
#book{position:absolute;right:78px;top:92px;width:384px;height:535px;transform:rotate(5deg);border-radius:6px;overflow:hidden;
 box-shadow:0 0 0 10px #fff,0 30px 60px rgba(25,50,90,.45)}

#h1{font-family:skybold;position:absolute;left:52px;top:128px;font-weight:700;font-size:200px;line-height:1.15;color:#1f3b63;
 -webkit-text-stroke:0;text-shadow:0 6px 0 #fff,0 -2px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,4px 6px 0 #fff,-4px 6px 0 #fff,0 14px 24px rgba(25,50,90,.35)}
#hl{position:absolute;left:58px;top:462px;width:580px;height:38px;background:#f2e35c;border-radius:24px;transform:rotate(-2deg);opacity:.95}
#h2{font-family:skybold;position:absolute;left:62px;top:380px;font-weight:700;font-size:84px;line-height:1.25;color:#fff;text-shadow:0 4px 0 #1f3b63,3px 0 0 #1f3b63,-3px 0 0 #1f3b63,0 -3px 0 #1f3b63,3px 4px 0 #1f3b63,-3px 4px 0 #1f3b63,0 10px 20px rgba(25,50,90,.35)}
#brand{font-family:goodfriend;position:absolute;left:64px;bottom:52px;display:flex;align-items:center;gap:12px;padding:10px 24px 12px 16px;background:rgba(255,255,255,.85);border-radius:40px;color:#4c6d90;font-weight:600;font-size:30px;box-shadow:0 6px 16px rgba(25,50,90,.18)}
</style></head><body><div id="s">

<div id="hl"></div>

<div id="h1">ปล่อยเขา</div>
<div id="h2">แล้วใจเราจะเบาขึ้น</div>
<div id="brand"><svg width="34" height="34" viewBox="-20 -20 40 40"><path d="M0,12 C-24,-6 -11,-25 0,-10 C11,-25 24,-6 0,12Z" fill="#8fb0d0"/></svg>ฮีลใจ by book</div>
<div id="book"><img src="let-them-cover.jpg"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg',g=document.getElementById('stars');let s=11;const R=()=>(s=(s*16807)%2147483647)/2147483647;
function star(x,y,r,c,o){const p=document.createElementNS(NS,'path');let d='';for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;d+=(i?'L':'M')+(x+Math.cos(a)*rr)+','+(y+Math.sin(a)*rr)}p.setAttribute('d',d+'Z');p.setAttribute('fill',c);p.setAttribute('opacity',o);p.setAttribute('stroke',c);p.setAttribute('stroke-width',r*.25);p.setAttribute('stroke-linejoin','round');g.appendChild(p)}
for(let i=0;i<55;i++){const x=R()*1280,y=R()*720;if(x<700&&y>130&&y<500)continue;star(x,y,R()<.2?10+R()*8:3+R()*4,R()<.3?'#6d93c2':'#fff',.55+R()*.4)}
star(735,110,22,'#fff',1);star(1230,640,18,'#fff',.95);star(700,620,14,'#f2e35c',1);
</script></body></html>
