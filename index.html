<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียน LINE AI</title>

  <!-- LIFF SDK & Tailwind CSS -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- LINE Seed Sans TH -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mumu-f/line-seed-sans-th@main/css/line-seed-sans-th.css">

  <style>
    * {
      font-family: 'LINE Seed Sans TH', -apple-system, BlinkMacSystemFont, sans-serif !important;
    }

    body {
      background-color: #f4f7ff;
    }

    @keyframes floatCat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }
    .animate-float {
      animation: floatCat 2.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full">

    <!-- Form View -->
    <div id="formContainer" class="bg-white p-6 rounded-3xl shadow-xl border border-slate-100">
      
      <!-- Header -->
      <div class="text-center mb-6">
        <div class="inline-block bg-blue-100 text-blue-600 text-xs font-semibold px-3 py-1 rounded-full mb-2">
          FREE WORKSHOP • สำหรับเจ้าของธุรกิจ
        </div>
        <h1 class="text-2xl font-bold text-slate-800">
          LINE AI <span class="text-blue-600">เลขาส่วนตัวเจ้าของธุรกิจ</span>
        </h1>
        <p class="text-xs text-slate-500 mt-1">
          เชื่อม LINE เข้ากับ AI ให้ช่วยคิด ช่วยจำ และจัดการงานสำคัญได้ตลอดวัน
        </p>
      </div>

      <form id="regForm" class="space-y-4">
        <!-- ชื่อ-นามสกุล -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            ชื่อ-นามสกุล <span class="text-red-500">*</span>
          </label>
          <input type="text" id="fullname" required placeholder="ชื่อที่ใช้ลงทะเบียน" 
                 class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
        </div>

        <!-- ชื่อธุรกิจ / แบรนด์ -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            ชื่อธุรกิจ / แบรนด์ <span class="text-red-500">*</span>
          </label>
          <input type="text" id="businessName" required placeholder="เช่น ToGreater" 
                 class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
        </div>

        <!-- บริการที่สนใจ -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            บริการที่สนใจ <span class="text-red-500">*</span>
          </label>
          <select id="serviceType" required 
                  class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 bg-white">
            <option value="" disabled selected>กรุณาเลือกบริการที่ต้องการ</option>
            <option value="Broadcast Package">Broadcast Package</option>
            <option value="บริการยิง Ads">บริการยิง Ads</option>
            <option value="LINE Training">LINE Training</option>
            <option value="AI Training">AI Training</option>
          </select>
        </div>

        <!-- เบอร์โทร -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            เบอร์โทร <span class="text-red-500">*</span>
          </label>
          <input type="tel" id="phone" required placeholder="08X-XXX-XXXX" 
                 class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
        </div>

        <!-- ความต้องการเพิ่มเติม -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            อยากให้ AI ช่วยงานอะไรมากที่สุด? <span class="text-red-500">*</span>
          </label>
          <textarea id="aiNeed" rows="2" required placeholder="เช่น สรุปงาน เตือนติดตามลูกค้า ตอบคำถาม หรือช่วยคิดคอนเทนต์" 
                    class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <!-- Checkbox ยอมรับเงื่อนไข -->
        <div class="flex items-start space-x-2 pt-2">
          <input type="checkbox" id="acceptTerms" required 
                 class="mt-1 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded cursor-pointer">
          <label for="acceptTerms" class="text-xs text-slate-600 cursor-pointer leading-tight">
            ฉันยอมรับเงื่อนไขและข้อตกลงในการลงทะเบียนรับข้อมูลข่าวสาร
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200 text-sm shadow-md mt-2">
          ยืนยันการลงทะเบียน
        </button>
      </form>
    </div>

    <!-- Success View -->
    <div id="successView" class="hidden text-center px-4 py-8">
      
      <!-- Real 3D Blue Cat Image -->
      <div class="flex justify-center mb-3">
        <div class="w-52 h-52 relative animate-float flex items-center justify-center">
          <img src="https://raw.githubusercontent.com/sarunporn-ui/dsme-2026/main/image_f545c0.jpg" 
               alt="3D Blue Cat" 
               class="w-full h-full object-contain drop-shadow-2xl mix-blend-multiply" />
        </div>
      </div>

      <!-- Green Checkmark Circle -->
      <div class="flex justify-center mb-3">
        <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center shadow-sm">
          <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
      </div>

      <!-- Success Title -->
      <h2 class="text-2xl font-bold text-slate-900 mb-2">ลงทะเบียนสำเร็จ!</h2>
      
      <!-- Description -->
      <p class="text-xs text-slate-500 font-medium leading-relaxed">
        ยินดีด้วย แล้วเจอกันวันเรียนเลยนะ
      </p>
      <p class="text-xs text-slate-500 font-medium leading-relaxed mb-8">
        รายละเอียดจะส่งให้คุณผ่าน LINE OA
      </p>

      <!-- Back to LINE Button -->
      <button onclick="liff.closeWindow()" 
              class="w-full bg-white hover:bg-slate-50 text-blue-600 font-semibold py-3 px-6 rounded-2xl border border-blue-200 transition duration-200 text-sm shadow-sm">
        กลับไปที่ LINE
      </button>

    </div>

  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw6h0pWkP-I3EedD6Qp41v5Ua26A20yGptN3YlqVvEa1tS34sK8wI_-tT2GvS6A9J/exec";

    let lineProfile = {
      userId: "",
      displayName: "",
      pictureUrl: ""
    };

    async function main() {
      try {
        await liff.init({ liffId: "2011192780-bJnFBR4e" });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          lineProfile.userId = profile.userId || "";
          lineProfile.displayName = profile.displayName || "";
          lineProfile.pictureUrl = profile.pictureUrl || "";
        }
      } catch (err) {
        console.error("LIFF Init Error:", err);
      }
    }
    main();

    document.getElementById('regForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "กำลังบันทึกข้อมูล...";

      // เตรียมข้อมูลส่งเข้า Google Apps Script
      const payload = new URLSearchParams({
        userId: lineProfile.userId,
        displayName: lineProfile.displayName,
        pictureUrl: lineProfile.pictureUrl,
        fullname: document.getElementById('fullname').value,
        businessName: document.getElementById('businessName').value,
        serviceType: document.getElementById('serviceType').value,
        phone: document.getElementById('phone').value,
        aiNeed: document.getElementById('aiNeed').value
      });

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: payload.toString()
        });

        // สลับแสดงหน้าสำเร็จ
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('successView').classList.remove('hidden');

      } catch (err) {
        console.error("Submit Error:", err);
        alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง");
        btn.disabled = false;
        btn.innerText = "ยืนยันการลงทะเบียน";
      }
    });
  </script>
</body>
</html>
