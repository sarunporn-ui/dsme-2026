<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียน LINE AI</title>

  <!-- LIFF SDK & Tailwind CSS -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- LINE Seed Sans TH & Fallback Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    @import url('https://cdn.jsdelivr.net/gh/mumu-f/line-seed-sans-th@main/css/line-seed-sans-th.css');

    body {
      font-family: 'LINE Seed Sans TH', 'Prompt', sans-serif;
    }

    /* Cat Animation Keyframes */
    @keyframes bounceCat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(15deg); }
    }
    .animate-cat {
      animation: bounceCat 2s infinite ease-in-out;
    }
    .animate-tail {
      transform-origin: bottom left;
      animation: tailWag 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex justify-center items-center p-4">

  <div class="max-w-md w-full bg-white p-6 rounded-3xl shadow-xl border border-slate-100">

    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-block bg-blue-100 text-blue-600 text-xs font-semibold px-3 py-1 rounded-full mb-2">
        FREE WORKSHOP • สำหรับเจ้าของธุรกิจ
      </div>
      <h1 class="text-2xl font-bold text-slate-800">
        LINE AI <span class="text-blue-600">เลขาส่วนตัวเจ้าของธุรกิจ</span>
      </h1>
      <p class="text-xs text-slate-500 mt-1">
        เชื่อม LINE เข้ากับ AI ให้ช่วยคิด ช่วยจำ และจัดการงานสำคัญได้ตลอดวัน
      </p>
    </div>

    <!-- Form View -->
    <form id="regForm" class="space-y-4">
      
      <!-- ชื่อ-นามสกุล -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">
          ชื่อ-นามสกุล <span class="text-red-500">*</span>
        </label>
        <input type="text" id="fullname" required placeholder="ชื่อที่ใช้ลงทะเบียน" 
               class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
      </div>

      <!-- ชื่อธุรกิจ / แบรนด์ -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">
          ชื่อธุรกิจ / แบรนด์ <span class="text-red-500">*</span>
        </label>
        <input type="text" id="businessName" required placeholder="เช่น ToGreater" 
               class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
      </div>

      <!-- บริการที่สนใจ -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">
          บริการที่สนใจ <span class="text-red-500">*</span>
        </label>
        <select id="serviceType" required 
                class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 bg-white">
          <option value="" disabled selected>กรุณาเลือกบริการที่ต้องการ</option>
          <option value="Broadcast Package">Broadcast Package</option>
          <option value="บริการยิง Ads">บริการยิง Ads</option>
          <option value="LINE Training">LINE Training</option>
          <option value="AI Training">AI Training</option>
        </select>
      </div>

      <!-- เบอร์โทร -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">
          เบอร์โทร <span class="text-red-500">*</span>
        </label>
        <input type="tel" id="phone" required placeholder="08X-XXX-XXXX" 
               class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
      </div>

      <!-- ความต้องการเพิ่มเติม -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">
          อยากให้ AI ช่วยงานอะไรมากที่สุด? <span class="text-red-500">*</span>
        </label>
        <textarea id="aiNeed" rows="2" required placeholder="เช่น สรุปงาน เตือนติดตามลูกค้า ตอบคำถาม หรือช่วยคิดคอนเทนต์" 
                  class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500"></textarea>
      </div>

      <!-- Checkbox ยอมรับเงื่อนไข -->
      <div class="flex items-start space-x-2 pt-2">
        <input type="checkbox" id="acceptTerms" required 
               class="mt-1 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded cursor-pointer">
        <label for="acceptTerms" class="text-xs text-slate-600 cursor-pointer leading-tight">
          ฉันยอมรับเงื่อนไขและข้อตกลงในการลงทะเบียนรับข้อมูลข่าวสาร
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200 text-sm shadow-md mt-2">
        ยืนยันการลงทะเบียน
      </button>
    </form>

    <!-- Success View -->
    <div id="successView" class="hidden text-center py-4">
      
      <!-- Cute Animated Cat SVG -->
      <div class="flex justify-center mb-3">
        <div class="w-36 h-36 relative animate-cat flex items-center justify-center">
          <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
            <!-- Background Glow -->
            <circle cx="100" cy="100" r="80" fill="#EFF6FF" />
            
            <!-- Tail -->
            <path class="animate-tail" d="M140,130 Q170,120 160,90" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
            
            <!-- Body -->
            <ellipse cx="100" cy="125" rx="45" ry="35" fill="#3B82F6" />
            <ellipse cx="100" cy="125" rx="30" ry="22" fill="#FFFFFF" opacity="0.9"/>
            
            <!-- Head -->
            <circle cx="100" cy="80" r="32" fill="#3B82F6" />
            
            <!-- Ears -->
            <polygon points="75,58 70,30 90,50" fill="#2563EB" />
            <polygon points="125,58 130,30 110,50" fill="#2563EB" />
            <polygon points="76,55 73,36 87,50" fill="#93C5FD" />
            <polygon points="124,55 127,36 113,50" fill="#93C5FD" />
            
            <!-- Eyes (Happy ^ ^) -->
            <path d="M85,75 Q90,68 95,75" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
            <path d="M105,75 Q110,68 115,75" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
            
            <!-- Nose & Mouth -->
            <polygon points="97,80 103,80 100,84" fill="#F43F5E" />
            <path d="M94,87 Q100,92 106,87" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
            
            <!-- Cheeks -->
            <circle cx="82" cy="82" r="5" fill="#F43F5E" opacity="0.4"/>
            <circle cx="118" cy="82" r="5" fill="#F43F5E" opacity="0.4"/>
            
            <!-- Paws -->
            <ellipse cx="80" cy="150" rx="10" ry="7" fill="#2563EB" />
            <ellipse cx="120" cy="150" rx="10" ry="7" fill="#2563EB" />
          </svg>
        </div>
      </div>

      <h2 class="text-xl font-bold text-slate-800">ลงทะเบียนสำเร็จ!</h2>
      <p class="text-xs text-slate-500 mt-1 mb-6">
        เราได้รับข้อมูลของคุณเรียบร้อยแล้ว แล้วพบกันในคอร์สครับ
      </p>

      <button onclick="liff.closeWindow()" 
              class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl transition duration-200 text-sm">
        ปิดหน้านี้
      </button>
    </div>

  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw6h0pWkP-I3EedD6Qp41v5Ua26A20yGptN3YlqVvEa1tS34sK8wI_-tT2GvS6A9J/exec";

    let lineUserId = "";

    async function main() {
      try {
        await liff.init({ liffId: "2011192780-bJnFBR4e" });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          lineUserId = profile.userId;
        }
      } catch (err) {
        console.error("LIFF Init Error:", err);
      }
    }
    main();

    document.getElementById('regForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "กำลังส่งข้อมูล...";

      const formData = {
        userId: lineUserId,
        fullname: document.getElementById('fullname').value,
        businessName: document.getElementById('businessName').value,
        serviceType: document.getElementById('serviceType').value,
        phone: document.getElementById('phone').value,
        aiNeed: document.getElementById('aiNeed').value
      };

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        // แสดงหน้าสำเร็จ
        document.getElementById('regForm').classList.add('hidden');
        document.getElementById('successView').classList.remove('hidden');

      } catch (err) {
        alert("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
        btn.disabled = false;
        btn.innerText = "ยืนยันการลงทะเบียน";
      }
    });
  </script>
</body>
</html>
