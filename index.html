<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียน LINE AI</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mumu-f/line-seed-sans-th@main/css/line-seed-sans-th.css">

  <style>
    * { font-family: 'LINE Seed Sans TH', sans-serif !important; }
    body { background-color: #f4f7ff; }
    @keyframes floatCat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }
    .animate-float { animation: floatCat 2.8s infinite ease-in-out; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full">

    <div id="formContainer" class="bg-white p-6 rounded-3xl shadow-xl border border-slate-100">
      <div class="text-center mb-6">
        <div class="inline-block bg-blue-100 text-blue-600 text-xs font-semibold px-3 py-1 rounded-full mb-2">
          FREE WORKSHOP • สำหรับเจ้าของธุรกิจ
        </div>
        <h1 class="text-2xl font-bold text-slate-800">
          LINE AI <span class="text-blue-600">เลขาส่วนตัว</span>
        </h1>
      </div>

      <form id="regForm" class="space-y-4">
        <!-- Hidden Inputs สำหรับ UID -->
        <input type="hidden" name="userId" id="userId" value="">
        <input type="hidden" name="displayName" id="displayName" value="">

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ชื่อ-นามสกุล <span class="text-red-500">*</span></label>
          <input type="text" name="fullName" required class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ชื่อธุรกิจ / แบรนด์ <span class="text-red-500">*</span></label>
          <input type="text" name="businessName" required class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">บริการที่สนใจ <span class="text-red-500">*</span></label>
          <select name="businessType" required class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:border-blue-500 bg-white">
            <option value="" disabled selected>กรุณาเลือกบริการที่ต้องการ</option>
            <option value="Broadcast Package">Broadcast Package</option>
            <option value="บริการยิง Ads">บริการยิง Ads</option>
            <option value="LINE Training">LINE Training</option>
            <option value="AI Training">AI Training</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">เบอร์โทร <span class="text-red-500">*</span></label>
          <input type="tel" name="phone" required class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">อยากให้ AI ช่วยงานอะไร? <span class="text-red-500">*</span></label>
          <textarea name="aiGoal" rows="2" required class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:border-blue-500"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl mt-2">
          ยืนยันการลงทะเบียน
        </button>
      </form>
    </div>

    <!-- Success View -->
    <div id="successView" class="hidden text-center px-4 py-8">
      <div class="flex justify-center mb-3">
        <div class="w-52 h-52 relative animate-float flex items-center justify-center">
          <img src="https://cdni.iconscout.com/illustration/premium/thumb/blue-cat-3d-illustration-download-in-png-blend-fbx-gltf-file-formats--animal-kitty-pet-cute-avatar-pack-people-illustrations-8153098.png?f=webp&w=600" 
               alt="3D Blue Cat" class="w-full h-full object-contain drop-shadow-xl" />
        </div>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 mb-2">ลงทะเบียนสำเร็จ!</h2>
      <p class="text-xs text-slate-500 font-medium mb-8">รายละเอียดจะส่งให้คุณผ่าน LINE OA</p>
      <button onclick="liff.closeWindow()" class="w-full bg-white text-blue-600 font-semibold py-3 px-6 rounded-2xl border border-blue-200">
        กลับไปที่ LINE
      </button>
    </div>

  </div>

  <script>
    // อัปเดต URL ใหม่ของคุณเรียบร้อยแล้ว
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxYSQ3HNnT5KUDPouCIKxxu2zmvEltelhZs6EdHz6NLdeFn0Py9SvqUsYGmNyAwl-DT/exec";

    async function main() {
      try {
        await liff.init({ liffId: "2011192780-bJnFBR4e" });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          document.getElementById('userId').value = profile.userId || "";
          document.getElementById('displayName').value = profile.displayName || "";
        }
      } catch (err) { console.warn("LIFF Error:", err); }
    }
    main();

    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault(); 
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "กำลังบันทึกข้อมูล...";

      const form = document.getElementById('regForm');
      const formData = new FormData(form);

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors', 
        body: formData
      })
      .then(() => {
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('successView').classList.remove('hidden');
      })
      .catch((err) => {
        console.error(err);
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('successView').classList.remove('hidden');
      });
    });
  </script>
</body>
</html>
