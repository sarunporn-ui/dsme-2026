<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 วัน AI ตัดคลิป</title>
<style>
@font-face{font-family:"LINE Seed Sans TH";src:url(assets/fonts/LINESeedSansTH_Rg.ttf);font-weight:400}
@font-face{font-family:"LINE Seed Sans TH";src:url(assets/fonts/LINESeedSansTH_Bd.ttf);font-weight:700}
@font-face{font-family:"LINE Seed Sans TH";src:url(assets/fonts/LINESeedSansTH_He.ttf);font-weight:900}
:root{
  --tg-bg:#0F172A;--tg-bg-glow:#162B60;--tg-surface:#16203C;
  --tg-blue:#2563FF;--tg-blue-deep:#1B47C2;--tg-blue-soft:#C7D2FE;
  --tg-orange:#FF7A3D;--tg-orange-pale:#FFB088;
  --tg-text:#E6EEFF;--tg-text-muted:#B6C2D9;
  --tg-ink:#0F172A;--tg-ink-body:#475569;
  --tg-border:rgba(199,210,254,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060b18;font-family:"LINE Seed Sans TH",sans-serif;color:var(--tg-text);display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0}
.hl{color:var(--tg-orange)}
.banner{position:relative;overflow:hidden;flex:none;
  background:radial-gradient(ellipse 60% 70% at 100% 0%,var(--tg-bg-glow) 0%,transparent 70%),var(--tg-bg)}
.banner>*{position:absolute}
.s11{width:1080px;height:1080px}.s45{width:1080px;height:1350px}.s169{width:1440px;height:810px}
.center{left:0;right:0;text-align:center;justify-content:center;align-items:center}

/* กลุ่มข้อความหัว เรียงลงอัตโนมัติ */
.stack{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.stack.center{align-items:center}

.logo{display:flex}.logo img{height:100%}
.eyebrow{display:flex;align-items:center;gap:16px;font-size:18px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--tg-blue-soft)}
.eyebrow::before{content:"";width:52px;height:9px;border-radius:9px;background:var(--tg-orange)}
.title{font-weight:900;line-height:1.12;letter-spacing:-.02em;white-space:nowrap}
.sub{font-weight:700;line-height:1.3;white-space:nowrap}
/* Title frame (CI 3.6): กรอบ outline ทรงแคปซูล */
.frame{display:inline-block;border:5px solid var(--tg-text-muted);border-radius:999px;padding:.08em .7em .14em;margin:0 .15em .18em 0}
.desc{color:var(--tg-text);line-height:1.45}

.photo{-webkit-mask-image:var(--mv,none);mask-image:var(--mv,none)}
.photo i{position:absolute;inset:0;background:url(assets/greater-mick.jpg) center/cover no-repeat;
  -webkit-mask-image:var(--mh,none);mask-image:var(--mh,none)}

/* stat card: font-size = ขนาดตัวเลขหลัก */
.stat{font-size:34px;background:var(--tg-surface);border:3px solid var(--tg-border);border-radius:14px;padding:.45em .65em}
.stat small{display:block;font-size:.52em;color:var(--tg-text-muted);letter-spacing:.04em}
.stat b{display:block;font-weight:700;white-space:nowrap}

/* price box: font-size = base */
.price{font-size:19px;background:#14244F;border:3px solid var(--tg-blue);border-radius:14px;padding:.8em 1.3em;display:flex;align-items:center;gap:1.3em}
.price .now small{font-size:.95em;color:var(--tg-blue-soft);font-weight:700;letter-spacing:.04em}
.price .now b{display:block;font-size:4.2em;font-weight:900;color:var(--tg-orange);line-height:1;white-space:nowrap}
.price .now b sub{font-size:.3em;vertical-align:baseline;font-weight:700;margin-left:.15em}
.price .was{font-size:1.05em;color:var(--tg-text-muted);line-height:1.5}
.price .was s{font-size:1.45em;font-weight:700}
.chip-save{display:inline-block;margin-top:.3em;padding:.2em .7em;border-radius:8px;border:2px solid var(--tg-orange-pale);color:var(--tg-orange-pale);font-size:.95em;font-weight:700}
.price.col{flex-direction:column;align-items:flex-start;gap:.5em}

.cta{display:flex;align-items:center;gap:18px;font-size:21px;color:var(--tg-text)}
.cta .btn{background:var(--tg-orange);color:#fff;font-weight:700;border-radius:44px;padding:.6em 1.4em;font-size:1.12em;white-space:nowrap}
.cta b{font-weight:700}
.cta.between{justify-content:space-between}
.cta.col{flex-direction:column;align-items:flex-start;gap:12px}

/* B: วงกลมราคา / ที่นั่ง — font-size = base */
.badge{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.badge small{font-size:1em;font-weight:700}
.badge b{font-size:3.4em;font-weight:900;line-height:1.05}
.badge span{font-size:1em;font-weight:700}
.badge s{font-size:.95em;margin-top:.25em}
.badge.price-b{background:var(--tg-orange);color:#fff;transform:rotate(8deg)}
.badge.seat-b{background:#F8FAFF;color:var(--tg-ink);transform:rotate(-6deg)}
.badge.seat-b b{color:var(--tg-blue)}
.bar{display:flex;align-items:center;justify-content:space-between;background:rgba(22,32,60,.94);border:3px solid var(--tg-border);border-radius:20px;padding:22px 30px}
.bar .when small{display:block;font-size:18px;color:var(--tg-text-muted)}
.bar .when b{font-size:40px;font-weight:700;line-height:1.2}
.bar .when em{font-style:normal;font-size:20px;color:var(--tg-blue-soft)}
.bar .cta{flex-direction:column;align-items:flex-end;gap:10px}

/* C: ตั๋ว — font-size = base */
.ticket{background:#F8FAFF;color:var(--tg-ink);border-radius:22px;box-shadow:0 24px 50px rgba(0,0,0,.5);transform:rotate(-3deg)}
.t-top{padding:1.1em 1.4em .9em}
.t-label{font-size:.72em;font-weight:700;letter-spacing:.28em;color:var(--tg-blue)}
.t-row{display:flex;align-items:flex-end;justify-content:space-between;gap:1em;margin-top:.45em}
.t-row small{display:block;font-size:.78em;color:var(--tg-ink-body)}
.t-row b{font-size:1.4em;font-weight:700;white-space:nowrap}
.t-row .seats{text-align:right}
.t-row .seats b{font-size:1.25em}
.t-row .seats em{font-style:normal;font-weight:900;font-size:2.3em;color:var(--tg-blue);line-height:1;margin-right:.1em}
.t-cut{position:relative;border-top:3px dashed #C7D2FE;margin:0 1.2em}
.t-cut::before,.t-cut::after{content:"";position:absolute;top:-19px;width:36px;height:36px;border-radius:50%;background:var(--tg-bg)}
.t-cut::before{left:calc(-1.2em - 18px)}.t-cut::after{right:calc(-1.2em - 18px)}
.t-bot{padding:.8em 1.4em 1.1em;display:flex;align-items:center;gap:1.1em}
.t-bot small{display:block;font-size:.78em;font-weight:700;color:var(--tg-ink-body)}
.t-bot b{display:block;font-size:3.2em;font-weight:900;color:var(--tg-orange);line-height:1;white-space:nowrap}
.t-bot b sub{font-size:.3em;vertical-align:baseline;font-weight:700;margin-left:.15em;color:var(--tg-ink)}
.t-bot .was{font-size:.9em;color:var(--tg-ink-body);line-height:1.5}
.t-bot .was s{font-size:1.25em;font-weight:700}
.t-bot .chip{display:inline-block;margin-top:.3em;padding:.2em .7em;border-radius:8px;border:2px solid var(--tg-orange);color:var(--tg-orange);font-weight:700;font-size:.95em}

/* โลโก้เครื่องมือ (ลอยแบบไอคอนแอป) — width = ขนาดไอคอน */
.tool{display:flex;flex-direction:column;align-items:center;gap:10px;transform:rotate(-6deg)}
.tool .ic{width:100%;filter:drop-shadow(0 16px 30px rgba(0,0,0,.5))}
.tool .wm{width:82%}

.label{position:static;font-size:14px;letter-spacing:.2em;color:var(--tg-text-muted);margin-bottom:-28px}
</style>
</head>
