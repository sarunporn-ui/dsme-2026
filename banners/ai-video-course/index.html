<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CutGreater Banners</title>
<style>
@font-face{font-family:"LINE Seed Sans TH";src:url(assets/fonts/LINESeedSansTH_Rg.ttf);font-weight:400}
@font-face{font-family:"LINE Seed Sans TH";src:url(assets/fonts/LINESeedSansTH_Bd.ttf);font-weight:700}
@font-face{font-family:"LINE Seed Sans TH";src:url(assets/fonts/LINESeedSansTH_He.ttf);font-weight:900}
:root{
  --tg-bg:#0F172A;--tg-bg-glow:#162B60;--tg-surface:#16203C;
  --tg-blue:#2563FF;--tg-blue-deep:#1B47C2;--tg-blue-soft:#C7D2FE;
  --tg-orange:#FF7A3D;--tg-orange-pale:#FFB088;
  --tg-text:#E6EEFF;--tg-text-muted:#B6C2D9;
  --tg-ink:#0F172A;--tg-ink-body:#475569;
  --tg-border:rgba(199,210,254,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060b18;font-family:"LINE Seed Sans TH",sans-serif;color:var(--tg-text);display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0}
.hl{color:var(--tg-orange)}
.banner{position:relative;overflow:hidden;flex:none;
  background:radial-gradient(ellipse 60% 70% at 100% 0%,var(--tg-bg-glow) 0%,transparent 70%),var(--tg-bg)}
.banner>*{position:absolute}
.s11{width:1080px;height:1080px}.s45{width:1080px;height:1350px}.s169{width:1440px;height:810px}
.center{left:0;right:0;text-align:center;justify-content:center}

.logo{display:flex}.logo img{height:100%}
.eyebrow{display:flex;align-items:center;gap:16px;font-size:15px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--tg-blue-soft)}
.eyebrow::before{content:"";width:47px;height:8px;border-radius:8px;background:var(--tg-orange)}
.title{font-weight:900;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.sub{font-weight:700;line-height:1.25;white-space:nowrap}
.desc{color:var(--tg-blue-soft);line-height:1.5}

.photo{-webkit-mask-image:var(--mv,none);mask-image:var(--mv,none)}
.photo i{position:absolute;inset:0;background:url(assets/greater-mick.jpg) center/cover no-repeat;
  -webkit-mask-image:var(--mh,none);mask-image:var(--mh,none)}

.pills{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.pill{display:inline-flex;align-items:center;height:44px;padding:0 24px;border-radius:44px;
  border:2px solid rgba(199,210,254,.5);background:rgba(199,210,254,.12);font-size:17px;color:var(--tg-blue-soft)}

/* stat card: font-size = ขนาดตัวเลขหลัก */
.stat{font-size:28px;background:var(--tg-surface);border:3px solid var(--tg-border);border-radius:14px;padding:.55em .7em}
.stat small{display:block;font-size:.5em;color:var(--tg-text-muted);letter-spacing:.06em}
.stat b{display:block;font-weight:700;white-space:nowrap;margin-top:.08em}

/* price box: font-size = base 16 */
.price{font-size:16px;background:#14244F;border:3px solid var(--tg-blue);border-radius:14px;padding:1em 1.5em;display:flex;align-items:center;gap:1.4em}
.price .now small{font-size:.94em;color:var(--tg-blue-soft);font-weight:700;letter-spacing:.06em}
.price .now b{display:block;font-size:4em;font-weight:900;color:var(--tg-orange);line-height:1;white-space:nowrap}
.price .now b sub{font-size:.34em;vertical-align:baseline;font-weight:700;margin-left:.15em}
.price .was{font-size:1.06em;color:var(--tg-text-muted);line-height:1.5}
.price .was s{font-size:1.4em;font-weight:700}
.chip-save{display:inline-block;margin-top:.35em;padding:.25em .75em;border-radius:8px;border:2px solid var(--tg-orange-pale);color:var(--tg-orange-pale);font-size:.85em;font-weight:700}
.price.col{flex-direction:column;align-items:flex-start;gap:.6em}

.cta{display:flex;align-items:center;gap:18px;font-size:17px;color:var(--tg-text)}
.cta .btn{background:var(--tg-orange);color:#fff;font-weight:700;border-radius:44px;padding:.7em 1.6em;font-size:1.12em;white-space:nowrap}
.cta b{font-weight:700}
.cta.between{justify-content:space-between}
.cta.col{flex-direction:column;align-items:flex-start;gap:12px}

/* B: วงกลมราคา / ที่นั่ง — font-size = base */
.badge{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.badge small{font-size:.95em;font-weight:700}
.badge b{font-size:3.4em;font-weight:900;line-height:1.05}
.badge span{font-size:.95em;font-weight:700}
.badge s{font-size:.9em;margin-top:.3em}
.badge.price-b{background:var(--tg-orange);color:#fff;transform:rotate(8deg)}
.badge.seat-b{background:#F8FAFF;color:var(--tg-ink);transform:rotate(-6deg)}
.badge.seat-b b{color:var(--tg-blue)}
.bar{display:flex;align-items:center;justify-content:space-between;background:rgba(22,32,60,.94);border:3px solid var(--tg-border);border-radius:20px;padding:22px 30px}
.bar .when small{display:block;font-size:15px;color:var(--tg-text-muted);letter-spacing:.06em}
.bar .when b{font-size:34px;font-weight:700}
.bar .when em{font-style:normal;font-size:17px;color:var(--tg-blue-soft)}
.bar .cta{flex-direction:column;align-items:flex-end;gap:10px}

/* C: ตั๋ว — font-size = base */
.ticket{background:#F8FAFF;color:var(--tg-ink);border-radius:22px;box-shadow:0 24px 50px rgba(0,0,0,.5);transform:rotate(-3deg)}
.t-top{padding:1.2em 1.5em 1em}
.t-label{font-size:.68em;font-weight:700;letter-spacing:.3em;color:var(--tg-blue)}
.t-row{display:flex;align-items:flex-end;justify-content:space-between;gap:1em;margin-top:.5em}
.t-row small{display:block;font-size:.7em;color:var(--tg-ink-body)}
.t-row b{font-size:1.35em;font-weight:700;white-space:nowrap}
.t-row .seats{text-align:right}
.t-row .seats b{font-size:1.2em}
.t-row .seats em{font-style:normal;font-weight:900;font-size:2.3em;color:var(--tg-blue);line-height:1;margin-right:.1em}
.t-cut{position:relative;border-top:3px dashed #C7D2FE;margin:0 1.2em}
.t-cut::before,.t-cut::after{content:"";position:absolute;top:-19px;width:36px;height:36px;border-radius:50%;background:var(--tg-bg)}
.t-cut::before{left:calc(-1.2em - 18px)}.t-cut::after{right:calc(-1.2em - 18px)}
.t-bot{padding:.9em 1.5em 1.2em;display:flex;align-items:center;gap:1.2em}
.t-bot small{display:block;font-size:.7em;font-weight:700;color:var(--tg-ink-body);letter-spacing:.06em}
.t-bot b{display:block;font-size:3.1em;font-weight:900;color:var(--tg-orange);line-height:1;white-space:nowrap}
.t-bot b sub{font-size:.33em;vertical-align:baseline;font-weight:700;margin-left:.15em;color:var(--tg-ink)}
.t-bot .was{font-size:.85em;color:var(--tg-ink-body);line-height:1.5}
.t-bot .was s{font-size:1.25em;font-weight:700}
.t-bot .chip{display:inline-block;margin-top:.3em;padding:.2em .7em;border-radius:8px;border:2px solid var(--tg-orange);color:var(--tg-orange);font-weight:700;font-size:.9em}

/* โลโก้เครื่องมือ (ลอยแบบไอคอนแอป) — width = ขนาดไอคอน */
.tool{display:flex;flex-direction:column;align-items:center;gap:10px;transform:rotate(-6deg)}
.tool .ic{width:100%;filter:drop-shadow(0 16px 30px rgba(0,0,0,.5))}
.tool .wm{width:82%}

.label{position:static;font-size:14px;letter-spacing:.2em;color:var(--tg-text-muted);margin-bottom:-28px}
</style>
</head>

<script>
/* เนื้อหาเดียวกันทุกแบนเนอร์ — แก้ที่นี่ที่เดียว */
const SEATS='10', DATE='เสาร์ 7 พ.ย. 2026', NOW='6,990', WAS='8,500', SAVE='1,510';
const T={
  capcut:()=>`<img class="ic" src="assets/capcut-icon.png" alt=""><img class="wm" src="assets/capcut-wordmark-white.png" alt="CapCut">`,
  logo:()=>`<img src="assets/logo-togreater.png" alt="ToGreater">`,

  title:()=>`Cut<span class="hl">Greater</span>`,

  sub2:()=>`AI ตัดต่อ VDO<br><span class="hl">คลิปพร้อมขาย</span>ในวันเดียว`,
  desc1:()=>`คอร์สเวิร์กช็อปสำหรับเจ้าของธุรกิจ · ตัดต่อเองได้ ไม่ต้องเป็นสายเทค`,

  pills:()=>`<span class="pill">ง่ายๆ</span><span class="pill">ใช้ได้จริง</span><span class="pill">เข้าใจธุรกิจ</span>`,
  date:()=>`<small>วันเรียน</small><b>${DATE}</b>`,
  seats:()=>`<small>รับจำกัด</small><b><span class="hl">${SEATS}</span> ที่นั่งเท่านั้น</b>`,
  price:()=>`<div class="now"><small>ราคารอบแรก</small><b>${NOW}<sub>บาท/ท่าน</sub></b></div>
             <div class="was">ราคาเต็ม <s>${WAS}</s><br><span class="chip-save">ประหยัด ${SAVE}.-</span></div>`,
  cta:()=>`<span class="btn">จองที่นั่ง LINE @togreater</span><span>โทร <b>095-064-7272</b> (คุณเกรท)</span>`,
  seatbadge:()=>`<small>รับเพียง</small><b>${SEATS}</b><span>ที่นั่ง</span>`,
  pricebadge:()=>`<small>ราคารอบแรก</small><b>${NOW}</b><span>บาท/ท่าน</span><s>ราคาเต็ม ${WAS}</s>`,
  bar:()=>`<div class="when"><small>วันเรียน</small><b>${DATE}</b><br><em>เวิร์กช็อป 1 วัน · ลงมือทำจริง</em></div>

};

/* เปิดด้วย #<id> เช่น #a45 = แสดงเฉพาะแบนเนอร์นั้น (ใช้ตอน export PNG) */
const only=location.hash.slice(1);
if(only){document.body.style.cssText='padding:0;gap:0;background:none;display:block';
  document.querySelectorAll('body>*:not(script)').forEach(b=>{if(b.id!==only)b.remove()})}
