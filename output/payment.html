<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:'Prompt','Loma',sans-serif;background:linear-gradient(145deg,#0b1437 0%,#1a2b6d 55%,#3b1f7a 100%);color:#fff;overflow:hidden;position:relative}
.glow1{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#00d4ff55,transparent 70%);top:-160px;right:-140px}
.glow2{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,#a855f755,transparent 70%);bottom:-220px;left:-200px}
.wrap{position:relative;z-index:2;padding:80px 80px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:18px}
.logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#00d4ff,#a855f7);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px}
.brand span{font-size:34px;font-weight:700;letter-spacing:1px}
.tag{margin-left:auto;padding:10px 22px;border:2px solid #00d4ff;border-radius:40px;color:#7ee8ff;font-size:22px;font-weight:600}
h1{margin-top:60px;font-size:78px;line-height:1.15;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(90deg,#00d4ff,#c084fc);-webkit-background-clip:text;color:transparent}
.sub{margin-top:12px;font-size:28px;color:#c7d2fe}
.card{margin-top:50px;background:#ffffff;color:#0b1437;border-radius:32px;padding:44px 50px;box-shadow:0 30px 60px #00000055}
.bank{display:flex;align-items:center;gap:16px}
.bdot{width:56px;height:56px;border-radius:50%;background:#138f2d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px}
.bank b{font-size:32px;font-weight:700;color:#138f2d}
.bank small{display:block;font-size:20px;color:#64748b;font-weight:500}
.lbl{margin-top:30px;font-size:22px;color:#64748b;font-weight:500}
.acc{font-size:88px;font-weight:800;letter-spacing:6px;line-height:1.1}
.name{font-size:40px;font-weight:700;margin-top:4px}
.foot{margin-top:auto;font-size:22px;color:#c7d2fe;text-align:center}
.foot b{color:#fff}
</style></head><body>
<div class="glow1"></div><div class="glow2"></div>
<div class="wrap">
 <div class="brand"><div class="logo">DM</div><span>DM lab</span><div class="tag">AI Course</div></div>
 <h1>โอนชำระ<br><em>ค่าเรียน AI</em></h1>
 <div class="sub">ช่องทางชำระเงินผ่านบัญชีธนาคาร</div>
 <div class="card">
  <div class="bank"><div class="bdot">K</div><div><b>KBANK</b><small>ธนาคารกสิกรไทย</small></div></div>
  <div class="lbl">เลขที่บัญชี</div>
  <div class="acc">214-3-63616-2</div>
  <div class="lbl">ชื่อบัญชี</div>
  <div class="name">บจก. มาเทีย</div>
 </div>
 <div class="foot">โอนแล้ว <b>ส่งสลิปยืนยัน</b> กับแอดมินได้เลย</div>
</div></body></html>
